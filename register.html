
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
        }

        body {
            font-family: Arial, sans-serif;
        }

        main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: rgb(4, 12, 31);
        }

        #contenedor {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 3rem;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: white;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.6rem;
            cursor: pointer;
        }

        button:hover {
            background: #388E3C;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensaje {
            color: #ff7777;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 15px;
        }

        #loginLink {
            display: block;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 20px;
        }

        .aviso {
            color: #b9c8df;
            font-size: 1.3rem;
            margin-top: -12px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<main>
    <div id="contenedor">

        <h1>Crear cuenta</h1>

        <form id="registroForm">

            <label for="username">Nombre de usuario:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ingrese su nombre"
                minlength="3"
                maxlength="255"
                autocomplete="username"
                required
            >

            <label for="userid">Número de identificación:</label>
            <input
                type="text"
                id="userid"
                name="userid"
                placeholder="Ingrese su número"
                inputmode="numeric"
                maxlength="20"
                autocomplete="off"
                required
            >

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Cree una contraseña"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirmar contraseña:</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Repita su contraseña"
                autocomplete="new-password"
                required
            >

            <label for="adminPassword">
                Contraseña de autorización:
            </label>

            <input
                type="password"
                id="adminPassword"
                name="adminPassword"
                placeholder="Ingrese la clave de autorización"
                autocomplete="off"
                required
            >

            <p class="aviso">
                Necesitas la clave de autorización para crear una cuenta.
            </p>

            <button type="submit" id="btnRegistro">
                Registrarme
            </button>

            <p id="mensaje" role="alert" aria-live="polite"></p>

        </form>

        <a href="/login.html" id="loginLink">
            ¿Ya tienes cuenta? Inicia sesión
        </a>

    </div>
</main>

    <script src="js/register.js"></script>

</body>
</html>
