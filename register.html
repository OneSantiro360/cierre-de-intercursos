
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
        }

        body {
            font-family: Arial, sans-serif;
        }

        main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: rgb(4, 12, 31);
        }

        #contenedor {
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 3rem;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: white;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.6rem;
            cursor: pointer;
        }

        button:hover {
            background: #388E3C;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensaje {
            color: #ff7777;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 15px;
        }

        #loginLink {
            display: block;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 20px;
        }

        .aviso {
            color: #b9c8df;
            font-size: 1.3rem;
            margin-top: -12px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<main>
    <div id="contenedor">

        <h1>Crear cuenta</h1>

        <form id="registroForm">

            <label for="username">Nombre de usuario:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Ingrese su nombre"
                minlength="3"
                maxlength="255"
                autocomplete="username"
                required
            >

            <label for="userid">Número de identificación:</label>
            <input
                type="text"
                id="userid"
                name="userid"
                placeholder="Ingrese su número"
                inputmode="numeric"
                maxlength="20"
                autocomplete="off"
                required
            >

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Cree una contraseña"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirmar contraseña:</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Repita su contraseña"
                autocomplete="new-password"
                required
            >

            <label for="adminPassword">
                Contraseña de autorización:
            </label>

            <input
                type="password"
                id="adminPassword"
                name="adminPassword"
                placeholder="Ingrese la clave de autorización"
                autocomplete="off"
                required
            >

            <p class="aviso">
                Necesitas la clave de autorización para crear una cuenta.
            </p>

            <button type="submit" id="btnRegistro">
                Registrarme
            </button>

            <p id="mensaje" role="alert" aria-live="polite"></p>

        </form>

        <a href="/login.html" id="loginLink">
            ¿Ya tienes cuenta? Inicia sesión
        </a>

    </div>
</main>

<script>
    const formulario = document.getElementById("registroForm");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("btnRegistro");

    formulario.addEventListener("submit", async (e) => {

        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const userid = document.getElementById("userid").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;
        const adminPassword = document.getElementById("adminPassword").value;

        mensaje.textContent = "";
        mensaje.style.color = "#ff7777";

        if (!/^\d{1,20}$/.test(userid)) {
            mensaje.textContent = "Ingrese un número de identificación válido";
            return;
        }

        if (password !== confirmPassword) {
            mensaje.textContent = "Las contraseñas no coinciden";
            return;
        }

        if (!adminPassword.trim()) {
            mensaje.textContent = "Debe ingresar la contraseña de autorización";
            return;
        }

        boton.disabled = true;
        boton.textContent = "Registrando...";

        try {

            const respuesta = await fetch("/api/register", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "same-origin",

                body: JSON.stringify({
                    username,
                    userid,
                    password,
                    adminPassword
                })
            });

            const resultado = await respuesta.json();

            if (!respuesta.ok) {
                throw new Error(
                    resultado.message || "No se pudo registrar"
                );
            }

            mensaje.style.color = "#4CAF50";
            mensaje.textContent = "¡Registro exitoso! Redirigiendo...";

            formulario.reset();

            setTimeout(() => {
                window.location.href = "/login.html";
            }, 1200);

        } catch (error) {

            mensaje.style.color = "#ff7777";
            mensaje.textContent = error.message;

        } finally {

            boton.disabled = false;
            boton.textContent = "Registrarme";

        }

    });
</script>

</body>
</html>
