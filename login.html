
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Intercursos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: rgb(4, 12, 31);
        }

        main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #contenedor {
            width: 100%;
            max-width: 400px;
        }

        #titulo {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 3rem;
        }

        label {
            display: block;
            color: white;
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 0 2px #4CAF50;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.6rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #388E3C;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensaje {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 18px;
            color: #ff7777;
        }

        #registroLink {
            display: block;
            color: white;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 25px;
            text-decoration: none;
        }

        #registroLink:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main>

        <div id="contenedor">

            <h1 id="titulo">Iniciar sesión</h1>

            <form id="loginForm">

                <label for="userid">
                    Número de identificación:
                </label>

                <input
                    type="text"
                    id="userid"
                    name="userid"
                    placeholder="Ingrese su número"
                    inputmode="numeric"
                    autocomplete="username"
                    maxlength="20"
                    required
                >

                <label for="password">
                    Contraseña:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="btnLogin">
                    Iniciar sesión
                </button>

                <p id="mensaje" role="alert" aria-live="polite"></p>
        </div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
